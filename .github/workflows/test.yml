name: test

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Offline self test
        run: python3 openpath.py selftest
      - name: Python / JavaScript engine parity
        run: |
          node --version
          python3 tools/crosscheck.py
      - name: Syntax check every Python file
        run: python3 -m compileall -q openpath tools openpath.py
      - name: Syntax check the worker and the panel
        run: |
          node --check worker/src/index.js
          for f in panel/assets/js/*.js; do node --check "$f"; done
      - name: CLI smoke test
        run: |
          python3 openpath.py help
          python3 openpath.py worker --help || true
