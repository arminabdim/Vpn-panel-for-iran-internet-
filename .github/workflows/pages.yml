name: pages

# Publishes the panel as a static GitHub Pages site, so anyone can use it
# without installing anything. The panel detects the missing bridge and runs
# in standalone mode: config generation, QR codes, templates and guides all
# keep working; only the automated deploy/relay buttons are disabled.
on:
  push:
    branches: [main]
    paths: ["panel/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the panel has no external dependencies
        run: |
          if grep -rEn 'src="https?://|href="https?://[^"]*\.css|@import ' panel/index.html panel/assets; then
            echo "::error::the panel must not load anything from the internet"
            grep -rEn 'src="https?://|href="https?://[^"]*\.css|@import ' panel/index.html panel/assets || true
            exit 1
          fi
          echo "ok - panel is fully self-contained"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: panel
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
