name: pages

# Publishes the panel as a static GitHub Pages site, so anyone can use it
# without installing anything. The panel detects the missing bridge and runs
# in standalone mode: config generation, QR codes, templates and guides all
# keep working; only the automated deploy/relay buttons are disabled.
on:
  push:
    branches: [main]
    paths: ["panel/**", "worker/src/index.js", "gas/Code.gs", "tools/pages_build.py",
            ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # tools/pages_build.py copies the panel into _site, ships the Worker and
      # Apps Script templates as templates/ (standalone mode renders them in the
      # browser) and fails the build if anything external sneaks in.
      - name: Build the panel (and check it is self-contained)
        run: python3 tools/pages_build.py --out _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
